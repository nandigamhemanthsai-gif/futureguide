<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clean Auth System</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"></script>
  <style>
    body { font-family: Arial; padding:20px }
    .hidden { display:none }
    .active { background:#4CAF50; color:white }
  </style>
</head>
<body>

<h2>Login / Register</h2>

<input id="email" placeholder="Email"><br><br>
<input id="password" placeholder="Password" type="password"><br><br>

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>

<h3>Phone OTP</h3>
<input id="phone" placeholder="+91XXXXXXXXXX"><br><br>
<div id="recaptcha"></div>
<button onclick="sendOTP()">Send OTP</button><br><br>

<input id="otp" placeholder="Enter OTP"><br><br>
<button onclick="verifyOTP()">Verify OTP</button>

<hr>

<h3>Language</h3>
<button onclick="toggleLang()">Select Language</button>
<div id="langBox" class="hidden">
  <button onclick="setLang('en', this)" data-label="English">English</button>
  <button onclick="setLang('ta', this)" data-label="Tamil">Tamil</button>
</div>
<p id="langText">Selected: English</p>

<script>
// 🔥 Firebase Config (replace with yours)
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_PROJECT_ID",
};

const app = firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// ✅ EMAIL AUTH
async function register() {
  try {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    await auth.createUserWithEmailAndPassword(email, password);
    alert('Registered successfully');
  } catch (e) {
    console.error(e);
    alert(e.message);
  }
}

async function login() {
  try {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    await auth.signInWithEmailAndPassword(email, password);
    alert('Login successful');
  } catch (e) {
    console.error(e);
    alert(e.message);
  }
}

// ✅ PHONE OTP (Firebase only)
let confirmationResult;

window.onload = function() {
  window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha', {
    size: 'normal'
  });
};

async function sendOTP() {
  try {
    const phone = document.getElementById('phone').value;
    confirmationResult = await auth.signInWithPhoneNumber(phone, window.recaptchaVerifier);
    alert('OTP sent');
  } catch (e) {
    console.error(e);
    alert(e.message);
  }
}

async function verifyOTP() {
  try {
    const code = document.getElementById('otp').value;
    await confirmationResult.confirm(code);
    alert('Phone verified');
  } catch (e) {
    console.error(e);
    alert('Invalid OTP');
  }
}

// ✅ LANGUAGE SYSTEM
function toggleLang() {
  const box = document.getElementById('langBox');
  box.classList.toggle('hidden');
}

function setLang(lang, el) {
  const label = el.dataset.label;
  document.getElementById('langText').innerText = 'Selected: ' + label;

  document.querySelectorAll('#langBox button').forEach(btn => btn.classList.remove('active'));
  el.classList.add('active');

  localStorage.setItem('lang', lang);
}

// Load saved language
window.addEventListener('load', () => {
  const saved = localStorage.getItem('lang');
  if(saved) {
    document.getElementById('langText').innerText = 'Selected: ' + saved;
  }
});

</script>

</body>
</html>
